databaseChangeLog:
  - changeSet:
      id: 001-create-tracks-table
      author: student
      changes:
        - createTable:
            tableName: news
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: title
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: images
                  type: varchar(200)
              - column:
                  name: description2
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: publish_date
                  type: TIMESTAMP
                  defaultValueComputed: "CURRENT_TIMESTAMP"
              - column:
                  name: pinned
                  type: BOOLEAN
              - column:
                  name: published
                  type: boolean
              - column:
                  name: archived
                  type: boolean